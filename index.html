<html lang="en">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>IndExo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #10b981;
      --accent-2: #6366f1;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --nav-bg: rgba(255, 255, 255, 0.92);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --surface: #111827;
        --surface-2: #1e293b;
        --border: #1f2937;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #10b981;
        --accent-2: #818cf8;
        --warn: #fbbf24;
        --danger: #f87171;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        --nav-bg: rgba(17, 24, 39, 0.94);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.45;
      overscroll-behavior-y: contain;
    }
    .app-header {
      position: sticky; top: 0; z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .menu-trigger {
      display: flex; align-items: center; gap: 10px;
      background: transparent; border: none; color: var(--text);
      padding: 4px 6px 4px 0; cursor: pointer; text-align: left;
    }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .brand-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .btn-refresh {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff; border: none; border-radius: 999px;
      padding: 7px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.3);
    }
    .btn-refresh.spinning svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .seg-bar {
      display: flex; gap: 4px; margin-top: 10px;
      background: var(--surface-2); padding: 3px; border-radius: 12px;
    }
    .seg-btn {
      flex: 1; border: none; background: transparent; color: var(--muted);
      padding: 7px 6px; border-radius: 9px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: var(--surface); color: var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .pill-row {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px;
      scrollbar-width: none;
    }
    .pill-row::-webkit-scrollbar { display: none; }
    .pill {
      white-space: nowrap; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pill.dark-active.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    main {
      padding: 12px 14px calc(86px + env(safe-area-inset-bottom));
      max-width: 720px; margin: 0 auto;
    }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 13px; box-shadow: var(--shadow);
    }
    .kpi-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; justify-content: space-between; gap: 4px;
    }
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
      background: rgba(16, 185, 129, 0.14); color: var(--accent);
    }
    .badge.neg { background: rgba(239, 68, 68, 0.14); color: var(--danger); }
    .kpi-val { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 5px 0 2px; }
    .kpi-val.green { color: var(--accent); }
    .kpi-val.amber { color: var(--warn); }
    .kpi-val.red { color: var(--danger); }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    .section-card { margin-top: 12px; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .section-title { font-size: 14px; font-weight: 700; }
    .section-sub { font-size: 11px; color: var(--muted); }
    .source-tag {
      font-size: 10px; font-weight: 600; color: var(--muted);
      background: var(--surface-2); padding: 4px 8px; border-radius: 8px; white-space: nowrap;
    }
    .chart-wrap { width: 100%; overflow-x: auto; }
    .chart-legend {
      display: flex; gap: 14px; justify-content: center;
      font-size: 11px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap;
    }
    .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
    .tooltip-box {
      margin-top: 8px; padding: 8px 10px; border-radius: 10px;
      background: var(--surface-2); font-size: 12px; color: var(--text);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    .driver-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .driver-row:last-child { border-bottom: none; }
    .bar-track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }

    .feed-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 8px; background: var(--surface-2);
    }
    .feed-title { font-size: 13px; font-weight: 700; }
    .feed-sub { font-size: 11px; color: var(--muted); }
    .feed-link { color: var(--accent); font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .notice-box {
      padding: 10px 12px; border-radius: 12px; background: var(--surface-2);
      border: 1px dashed var(--border); font-size: 12px; color: var(--muted); margin-top: 10px;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-btn {
      flex: 1; background: transparent; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; padding: 4px 0; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }

    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; bottom: 0; left: 0; width: 260px; z-index: 70;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: max(20px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
      transform: translateX(-100%); transition: transform 0.22s ease;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px 12px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .drawer-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
    .drawer-close {
      background: var(--surface-2); border: none; color: var(--text);
      width: 30px; height: 30px; border-radius: 8px; font-size: 17px; cursor: pointer;
    }
    #sectorList { display: flex; flex-direction: column; gap: 6px; }
    .sector-item {
      display: flex; align-items: center; width: 100%;
      padding: 13px 14px; border-radius: 12px; border: none;
      background: transparent; color: var(--text);
      font-size: 17px; font-weight: 600; text-align: left; cursor: pointer;
    }
    .sector-item.active { background: rgba(16, 185, 129, 0.14); color: var(--accent); }
    .drawer-footer {
      margin-top: auto; padding: 14px 8px 4px;
      border-top: 1px solid var(--border);
    }
    .drawer-footer-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px;
    }
    .drawer-footer-text {
      font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4;
    }
    .status-banner { font-size: 11px; color: var(--muted); margin-top: 6px; }
  </style>
</head>

async function fetchWorldBankLive() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('spinning');
  state.wbLive.status = 'Syncing World Bank Open Data API...';
  render();
  try {
    const fetchInd = async (code) => {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(`https://api.worldbank.org/v2/country/IND/indicator/${code}?format=json&mrv=4`, { signal: ctrl.signal });
      clearTimeout(t);
      const json = await res.json();
      const rows = (json && json[1]) ? json[1].filter(r => r.value !== null) : [];
      return rows[0] || null;
    };
    const [nom, gr, pc, ppp, pcPpp, exp, imp] = await Promise.all([
      fetchInd('NY.GDP.MKTP.CD'), fetchInd('NY.GDP.MKTP.KD.ZG'), fetchInd('NY.GDP.PCAP.CD'),
      fetchInd('NY.GDP.MKTP.PP.CD'), fetchInd('NY.GDP.PCAP.PP.CD'),
      fetchInd('NE.EXP.GNFS.CD'), fetchInd('NE.IMP.GNFS.CD')
    ]);
    state.wbLive.gdp = { nom, gr, pc, ppp, pcPpp };
    state.wbLive.trade = { exp, imp };
    state.wbLive.status = `Synced live from World Bank API (${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })})`;
  } catch (e) {
    state.wbLive.status = 'Unable to reach World Bank API right now; official MoSPI / PIB / RBI / IMF data remains active.';
  } finally {
    btn.classList.remove('spinning');
    render();
  }
}

document.getElementById('btnRefresh').addEventListener('click', fetchWorldBankLive);

function buildBarChartSVG(items, seriesA, seriesB, labelA, labelB, colorA, colorB, unitPrefix = '', unitSuffix = '') {
  const maxVal = Math.max(...items.flatMap(d => [d[seriesA] || 0, seriesB ? (d[seriesB] || 0) : 0]), 1) * 1.15;
  const w = Math.max(320, items.length * 56);
  const h = 180;
  const padB = 26, padT = 12, padL = 36;
  const plotH = h - padB - padT;
  const barW = seriesB ? 14 : 22, gap = 4;
  const step = (w - padL) / items.length;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + plotH * (1 - f);
    const val = (maxVal * f).toFixed(maxVal > 20 ? 0 : 1);
    return `<line x1="${padL}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>
            <text x="${padL - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${unitPrefix}${val}${unitSuffix}</text>`;
  }).join('');

  const bars = items.map((d, i) => {
    const cx = padL + i * step + step / 2;
    const vA = d[seriesA] || 0;
    const vB = seriesB ? (d[seriesB] || 0) : 0;
    const hA = (vA / maxVal) * plotH;
    const hB = (vB / maxVal) * plotH;
    const xA = seriesB ? cx - barW - gap/2 : cx - barW/2;
    const active = i === state.selectedIdx ? 'opacity="1"' : 'opacity="0.82"';
    return `<g data-idx="${i}" style="cursor:pointer" ${active}>
      <rect x="${xA}" y="${padT + plotH - hA}" width="${barW}" height="${hA}" rx="4" fill="${colorA}"/>
      ${seriesB ? `<rect x="${cx + gap/2}" y="${padT + plotH - hB}" width="${barW}" height="${hB}" rx="4" fill="${colorB}"/>` : ''}
      <text x="${cx}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${i === state.selectedIdx ? '700' : '500'}" fill="${i === state.selectedIdx ? 'var(--text)' : 'var(--muted)'}">${d.period.replace(' 2026', '')}</text>
    </g>`;
  }).join('');

  return `<div class="chart-legend"><span><i class="legend-dot" style="background:${colorA}"></i>${labelA}</span>${seriesB ? `<span><i class="legend-dot" style="background:${colorB}"></i>${labelB}</span>` : ''}</div>
    <div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="190" class="interactive-svg">${gridLines}${bars}</svg></div>`;
}

      ? DATA.trade.monthly.map(r => {
          let exp = r.mExp + r.sExp, imp = r.mImp + r.sImp;
          if (state.scope === 'goods') { exp = r.mExp; imp = r.mImp; }
          else if (state.scope === 'services') { exp = r.sExp; imp = r.sImp; }
          else if (state.scope === 'core') { exp = r.cExp; imp = r.cImp; }
          return { ...r, exp: +exp.toFixed(2), imp: +imp.toFixed(2), bal: +(exp - imp).toFixed(2) };
        })
      : DATA.trade[state.timeframe].map(r => {
          const exp = r.exp ?? +(r.mExp + r.sExp).toFixed(2);
          const imp = r.imp ?? +(r.mImp + r.sImp).toFixed(2);
          return { ...r, exp, imp, bal: +(exp - imp).toFixed(2) };
        });
    const cur = rows[Math.min(state.selectedIdx, rows.length - 1)];
    main.innerHTML = `
      <div class="pill-row">${rows.map((r, i) => `<button class="pill dark-active ${i === state.selectedIdx ? 'active' : ''}" data-idx="${i}">${r.period}</button>`).join('')}</div>
      <div class="kpi-grid">
        <div class="card"><div class="kpi-label">Exports <span class="badge ${cur.yoy < 0 ? 'neg' : ''}">${cur.yoy > 0 ? '+' : ''}${cur.yoy}% YoY</span></div><div class="kpi-val green">$${cur.exp}B</div><div class="kpi-sub">${cur.period} · ${cur.pr}</div></div>
        <div class="card"><div class="kpi-label">Imports</div><div class="kpi-val amber">$${cur.imp}B</div><div class="kpi-sub">Inward flow</div></div>
        <div class="card"><div class="kpi-label">Trade Balance</div><div class="kpi-val red">-$${Math.abs(cur.bal)}B</div><div class="kpi-sub">Net Deficit</div></div>
        <div class="card"><div class="kpi-label">Total Volume</div><div class="kpi-val">$${(cur.exp + cur.imp).toFixed(2)}B</div><div class="kpi-sub">Exports + Imports</div></div>
      </div>
      <div class="card section-card">
        <div class="section-head"><div class="section-title">Exports vs Imports Trend</div><span class="source-tag">PIB / MoC&I</span></div>
        ${buildBarChartSVG(rows, 'exp', 'imp', 'Exports ($B)', 'Imports ($B)', '#10b981', '#f59e0b', '$', 'B')}
      </div>`;
  } else if (state.tab === 'ledger') {
    main.innerHTML = `<div class="card"><div class="section-head"><div class="section-title">Monthly EXIM Ledger (US$ Bn)</div></div>
      <table><thead><tr><th>Month</th><th class="num">Merch Exp</th><th class="num">Serv Exp</th><th class="num">Tot Exp</th><th class="num">Tot Imp</th></tr></thead>
      <tbody>${DATA.trade.monthly.map(r => `<tr><td><strong>${r.period}</strong></td><td class="num">$${r.mExp}</td><td class="num">$${r.sExp}</td><td class="num">$${(r.mExp+r.sExp).toFixed(2)}</td><td class="num">$${(r.mImp+r.sImp).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if (state.tab === 'drivers') {
    main.innerHTML = `<div class="card"><div class="section-head"><div class="section-title">Top Export Drivers (Oct 2026)</div></div>
      ${DATA.trade.drivers.map(d => `<div class="driver-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${d.name}</span><span style="color:var(--accent)">${d.val}</span></div><div class="bar-track"><div class="bar-fill" style="width:${d.pct}%"></div></div></div></div>`).join('')}</div>`;
  } else {
    const wb = state.wbLive.trade;
    main.innerHTML = `<div class="card"><div class="section-head"><div class="section-title">Official Trade Feeds</div></div>
      ${DATA.trade.feeds.map(f => `<div class="feed-item"><div><div class="feed-title">${f.name}</div><div class="feed-sub">${f.sub}</div></div><a class="feed-link" href="${f.url}" target="_blank" rel="noopener">Open ↗</a></div>`).join('')}</div>
      <div class="card section-card"><div class="section-head"><div><div class="section-title">World Bank Live Annual Feed</div><div class="section-sub">NE.EXP.GNFS.CD & NE.IMP.GNFS.CD (mrv=4)</div></div><button class="btn-refresh" id="btnInlineFetch">Fetch Live</button></div>
      <div class="status-banner">${state.wbLive.status}</div>
      ${wb ? `<div class="kpi-grid" style="margin-top:10px"><div class="card"><div class="kpi-label">WB Exports (${wb.exp?.date || '—'})</div><div class="kpi-val green">$${wb.exp ? (wb.exp.value/1e9).toFixed(1)+'B' : '—'}</div></div><div class="card"><div class="kpi-label">WB Imports (${wb.imp?.date || '—'})</div><div class="kpi-val amber">$${wb.imp ? (wb.imp.value/1e9).toFixed(1)+'B' : '—'}</div></div></div>` : ''}</div>`;
    document.getElementById('btnInlineFetch')?.addEventListener('click', fetchWorldBankLive);
  }
  main.querySelectorAll('.pill[data-idx]').forEach(p => p.addEventListener('click', () => { state.selectedIdx = Number(p.dataset.idx); render(); }));
  attachChartClicks();
}

function renderRichSector(main) {
  const tfBar = document.getElementById('timeframeBar');
  tfBar.innerHTML = ['monthly', 'quarterly', 'annual'].map(tf =>
    `<button class="seg-btn ${state.timeframe === tf ? 'active' : ''}" data-tf="${tf}">${tf.charAt(0).toUpperCase() + tf.slice(1)}</button>`
  ).join('');
  tfBar.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => { state.timeframe = b.dataset.tf; render(); }));
  document.getElementById('scopeBar').innerHTML = '';

  const cfg = DATA[state.sector];
  const tfKey = state.timeframe === 'states' ? 'annual' : state.timeframe;

  if (state.tab === 'overview') {
    const kpis = cfg.kpis[tfKey];
    const idx = Math.min(state.selectedIdx, cfg.chartData.length - 1);
    const cur = cfg.chartData[idx];
    main.innerHTML = `
      <div class="kpi-grid">${kpis.map(k => `<div class="card"><div class="kpi-label">${k.label} ${k.badge ? `<span class="badge">${k.badge}</span>` : ''}</div><div class="kpi-val ${k.tone || ''}">${k.val}</div><div class="kpi-sub">${k.sub}</div></div>`).join('')}</div>
      <div class="card section-card">
        <div class="section-head"><div><div class="section-title">${cfg.chartTitle}</div><div class="section-sub">${cfg.chartSub}</div></div><span class="source-tag">${cfg.sourceTag}</span></div>
        ${buildBarChartSVG(cfg.chartData, 'valA', cfg.labelB ? 'valB' : null, cfg.labelA, cfg.labelB || '', '#10b981', '#6366f1', cfg.prefix || '', cfg.suffix || '')}
        ${cur ? `<div class="tooltip-box"><span><strong>${cur.period}</strong></span><span>${cfg.prefix || ''}${cur.valA}${cfg.suffix || ''}${cur.valB !== undefined ? ` · ${cfg.labelB}: ${cur.valB}` : ''}</span></div>` : ''}
      </div>`;
  } else if (state.tab === 'ledger') {
    const rows = cfg[tfKey];
    main.innerHTML = `<div class="card"><div class="section-head"><div><div class="section-title">${SECTORS.find(x => x.id === state.sector).label} — ${tfKey.toUpperCase()} Ledger</div></div></div>
      <table><thead><tr><th>${cfg.ledgerHeaders[0]}</th><th>${cfg.ledgerHeaders[1]}</th><th>${cfg.ledgerHeaders[2]}</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><strong>${r.period}</strong></td><td>${r.col1}</td><td>${r.col2}</td></tr>`).join('')}</tbody></table></div>`;
  } else if (state.tab === 'drivers') {
    main.innerHTML = `<div class="card"><div class="section-head"><div><div class="section-title">${cfg.driversTitle}</div><div class="section-sub">${cfg.driversSub}</div></div></div>
      ${cfg.drivers.map(d => `<div class="driver-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${d.name}</span><span style="color:var(--accent)">${d.val}</span></div><div class="bar-track"><div class="bar-fill" style="width:${d.pct}%"></div></div></div></div>`).join('')}</div>`;
  } else {
    main.innerHTML = `<div class="card"><div class="section-head"><div><div class="section-title">Official ${SECTORS.find(x => x.id === state.sector).label} Feeds</div><div class="section-sub">Verified primary sources</div></div></div>
      ${cfg.feeds.map(f => `<div class="feed-item"><div><div class="feed-title">${f.name}</div><div class="feed-sub">${f.sub}</div></div><a class="feed-link" href="${f.url}" target="_blank" rel="noopener">Open ↗</a></div>`).join('')}</div>`;
  }
  attachChartClicks();
}

function render() {
  initDrawer();
  const sec = SECTORS.find(s => s.id === state.sector);
  document.getElementById('headerTitle').textContent = `IndExo · ${sec.label}`;
  document.getElementById('drawerSources').textContent = sec.sub;
  document.getElementById('bottomNav').querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));

  const main = document.getElementById('appMain');
  if (state.sector === 'gdp') renderGDP(main);
  else if (state.sector === 'trade') renderTrade(main);
  else renderRichSector(main);
}

render();
</script>
</body>
</html>
