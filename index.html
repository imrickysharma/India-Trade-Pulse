<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="India Macro Pulse" />
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>India Macro & Trade Pulse</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #10b981;
      --accent-2: #6366f1;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --nav-bg: rgba(255, 255, 255, 0.92);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --surface: #111827;
        --surface-2: #1e293b;
        --border: #1f2937;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #10b981;
        --accent-2: #818cf8;
        --warn: #fbbf24;
        --danger: #f87171;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        --nav-bg: rgba(17, 24, 39, 0.94);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.45;
      overscroll-behavior-y: contain;
    }
    .app-header {
      position: sticky; top: 0; z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .menu-trigger {
      display: flex; align-items: center; gap: 10px;
      background: transparent; border: none; color: var(--text);
      padding: 4px 6px 4px 0; cursor: pointer; text-align: left;
    }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-sub { font-size: 11px; color: var(--muted); display: block; }
    .btn-refresh {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff; border: none; border-radius: 999px;
      padding: 7px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.3);
    }
    .btn-refresh.spinning svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .seg-bar {
      display: flex; gap: 4px; margin-top: 10px;
      background: var(--surface-2); padding: 3px; border-radius: 12px;
    }
    .seg-btn {
      flex: 1; border: none; background: transparent; color: var(--muted);
      padding: 7px 6px; border-radius: 9px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: var(--surface); color: var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .pill-row {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px;
      scrollbar-width: none;
    }
    .pill-row::-webkit-scrollbar { display: none; }
    .pill {
      white-space: nowrap; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .pill.dark-active.active {
      background: var(--text); color: var(--bg); border-color: var(--text);
    }

    main {
      padding: 12px 14px calc(86px + env(safe-area-inset-bottom));
      max-width: 720px; margin: 0 auto;
    }
    .kpi-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 13px; box-shadow: var(--shadow);
    }
    .kpi-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; justify-content: space-between; gap: 4px;
    }
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
      background: rgba(16, 185, 129, 0.14); color: var(--accent);
    }
    .badge.neg { background: rgba(239, 68, 68, 0.14); color: var(--danger); }
    .badge.warn { background: rgba(245, 158, 11, 0.16); color: var(--warn); }
    .kpi-val {
      font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 5px 0 2px;
    }
    .kpi-val.green { color: var(--accent); }
    .kpi-val.amber { color: var(--warn); }
    .kpi-val.red { color: var(--danger); }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    .section-card { margin-top: 12px; }
    .section-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .section-title { font-size: 14px; font-weight: 700; }
    .section-sub { font-size: 11px; color: var(--muted); }
    .source-tag {
      font-size: 10px; font-weight: 600; color: var(--muted);
      background: var(--surface-2); padding: 4px 8px; border-radius: 8px;
      white-space: nowrap;
    }
    .chart-wrap { width: 100%; overflow-x: auto; }
    .chart-legend {
      display: flex; gap: 14px; justify-content: center;
      font-size: 11px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap;
    }
    .legend-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px;
    }
    .tooltip-box {
      margin-top: 8px; padding: 8px 10px; border-radius: 10px;
      background: var(--surface-2); font-size: 12px; color: var(--text);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td {
      text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border);
    }
    th { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    .driver-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .driver-row:last-child { border-bottom: none; }
    .bar-track {
      height: 6px; background: var(--surface-2); border-radius: 999px;
      overflow: hidden; margin-top: 4px;
    }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }

    .feed-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 8px; background: var(--surface-2);
    }
    .feed-title { font-size: 13px; font-weight: 700; }
    .feed-sub { font-size: 11px; color: var(--muted); }
    .feed-link {
      color: var(--accent); font-size: 12px; font-weight: 700;
      text-decoration: none; white-space: nowrap;
    }
    .notice-box {
      padding: 10px 12px; border-radius: 12px; background: var(--surface-2);
      border: 1px dashed var(--border); font-size: 12px; color: var(--muted);
      margin-top: 10px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-btn {
      flex: 1; background: transparent; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; padding: 4px 0; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }

    /* Left Slide-Out Menu Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; bottom: 0; left: 0; width: 250px; z-index: 70;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: max(20px, env(safe-area-inset-top)) 14px 24px;
      transform: translateX(-100%); transition: transform 0.22s ease;
      display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px;
    }
    .drawer-title { font-size: 15px; font-weight: 800; }
    .drawer-close {
      background: var(--surface-2); border: none; color: var(--text);
      width: 28px; height: 28px; border-radius: 8px; font-size: 16px; cursor: pointer;
    }
    .sector-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 12px; border: none;
      background: transparent; color: var(--text);
      font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
    }
    .sector-item.active {
      background: rgba(16, 185, 129, 0.14); color: var(--accent);
    }
    .status-banner {
      font-size: 11px; color: var(--muted); margin-top: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
  </style>
</head>

function initDrawer() {

    </button>
  `).join('');
  list.querySelectorAll('.sector-item').forEach(btn => {
    btn.addEventListener('click', () => {
      state.sector = btn.dataset.sector;
      state.tab = 'overview';
      if (state.sector === 'gdp') {
        state.timeframe = 'quarterly'; state.scope = 'all'; state.selectedIdx = DATA.gdp.quarterly.length - 1;
      } else if (state.sector === 'trade') {
        state.timeframe = 'monthly'; state.scope = 'all'; state.selectedIdx = DATA.trade.monthly.length - 1;
      } else {
        state.timeframe = 'monthly'; state.scope = 'all'; state.selectedIdx = 0;
      }
      closeDrawer();
      render();
    });
  });
}

async function fetchWorldBankLive() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('spinning');
  state.wbLive.status = 'Syncing World Bank Open Data API...';
  render();
  try {
    const fetchInd = async (code) => {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(`https://api.worldbank.org/v2/country/IND/indicator/${code}?format=json&mrv=4`, { signal: ctrl.signal });
      clearTimeout(t);
      const json = await res.json();
      const rows = (json && json[1]) ? json[1].filter(r => r.value !== null) : [];
      return rows[0] || null;
    };
    const [nom, gr, pc, ppp, pcPpp, exp, imp] = await Promise.all([
      fetchInd('NY.GDP.MKTP.CD'),
      fetchInd('NY.GDP.MKTP.KD.ZG'),
      fetchInd('NY.GDP.PCAP.CD'),
      fetchInd('NY.GDP.MKTP.PP.CD'),
      fetchInd('NY.GDP.PCAP.PP.CD'),
      fetchInd('NE.EXP.GNFS.CD'),
      fetchInd('NE.IMP.GNFS.CD')
    ]);
    state.wbLive.gdp = { nom, gr, pc, ppp, pcPpp };
    state.wbLive.trade = { exp, imp };
    state.wbLive.status = `Synced live from World Bank API (${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })})`;
  } catch (e) {
    state.wbLive.status = 'Unable to reach World Bank API right now; official MoSPI / PIB / RBI / IMF data remains active.';
  } finally {
    btn.classList.remove('spinning');
    render();
  }
}

document.getElementById('btnRefresh').addEventListener('click', fetchWorldBankLive);

function buildBarChartSVG(items, seriesA, seriesB, labelA, labelB, colorA, colorB, unitPrefix = '', unitSuffix = '') {
  const maxVal = Math.max(...items.flatMap(d => [d[seriesA] || 0, d[seriesB] || 0]), 1) * 1.15;
  const w = Math.max(320, items.length * 56);
  const h = 180;
  const padB = 26, padT = 12, padL = 36;
  const plotH = h - padB - padT;
  const barW = 14, gap = 4;
  const step = (w - padL) / items.length;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + plotH * (1 - f);
    const val = (maxVal * f).toFixed(maxVal > 20 ? 0 : 1);
    return `<line x1="${padL}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>
            <text x="${padL - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${unitPrefix}${val}${unitSuffix}</text>`;
  }).join('');

  const bars = items.map((d, i) => {
    const cx = padL + i * step + step / 2;
    const vA = d[seriesA] || 0;
    const vB = d[seriesB] || 0;
    const hA = (vA / maxVal) * plotH;
    const hB = (vB / maxVal) * plotH;
    const active = i === state.selectedIdx ? 'opacity="1"' : 'opacity="0.82"';
    return `<g data-idx="${i}" style="cursor:pointer" ${active}>
      <rect x="${cx - barW - gap/2}" y="${padT + plotH - hA}" width="${barW}" height="${hA}" rx="4" fill="${colorA}"/>
      ${seriesB ? `<rect x="${cx + gap/2}" y="${padT + plotH - hB}" width="${barW}" height="${hB}" rx="4" fill="${colorB}"/>` : ''}
      <text x="${cx}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${i === state.selectedIdx ? '700' : '500'}" fill="${i === state.selectedIdx ? 'var(--text)' : 'var(--muted)'}">${d.period.replace(' 2026', '')}</text>
    </g>`;
  }).join('');

  return `
    <div class="chart-legend">
      <span><i class="legend-dot" style="background:${colorA}"></i>${labelA}</span>
      ${seriesB ? `<span><i class="legend-dot" style="background:${colorB}"></i>${labelB}</span>` : ''}
    </div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="190" class="interactive-svg">${gridLines}${bars}</svg>
    </div>`;
}

                <div style="display:flex;justify-content:space-between;font-weight:600;font-size:13px;">
                  <span>${idx + 1}. ${s.state} <small style="color:var(--muted);font-weight:400">(${s.year})</small></span>
                  <span>₹${s.gsdp.toFixed(2)}L Cr</span>
                </div>
                <div class="bar-track"><div class="bar-fill" style="width:${(s.gsdp / maxG * 100).toFixed(1)}%"></div></div>
              </div>
            </div>
          `).join('')}
          <div class="notice-box">
            <strong>*Note on Gujarat &amp; City-wise GDP:</strong> Gujarat's latest reported figure in RBI Table 21 is FY2022-23 (2023-24/2024-25 marked unavailable). Official Indian Government (MoSPI), RBI, IMF, and World Bank databases do not publish a city-wise GDP ranking; MoSPI has published District Domestic Product (DDP) guidelines under Base Year 2022-23.
          </div>
        </div>`;
    }
  } else if (state.tab === 'ledger') {
    main.innerHTML = `
      <div class="card">
        <div class="section-head"><div><div class="section-title">Annual GDP & Per Capita Ledger</div><div class="section-sub">MoSPI Base 2022-23 · World Bank · IMF WEO Oct 2026</div></div></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Year</th><th class="num">Real %</th><th class="num">Nom ($T)</th><th class="num">PPP ($T)</th><th class="num">Per Cap ($)</th></tr></thead>
            <tbody>
              ${DATA.gdp.annual.map(r => `<tr><td><strong>${r.period}</strong><br><small style="color:var(--muted)">${r.tag}</small></td><td class="num">${r.realG}%</td><td class="num">$${r.nomUsd}T</td><td class="num">$${r.pppUsd}T</td><td class="num">$${r.pcUsd.toLocaleString()}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card section-card">
        <div class="section-head"><div><div class="section-title">Quarterly GDP Ledger (₹ Lakh Cr)</div><div class="section-sub">MoSPI National Accounts (Base 2022-23)</div></div></div>
        <table>
          <thead><tr><th>Quarter</th><th class="num">Real GDP</th><th class="num">Real %</th><th class="num">Nom GDP</th><th class="num">Nom %</th></tr></thead>
          <tbody>
            ${DATA.gdp.quarterly.map(q => `<tr><td><strong>${q.period}</strong></td><td class="num">₹${q.real}L</td><td class="num">+${q.realG}%</td><td class="num">₹${q.nom}L</td><td class="num">+${q.nomG}%</td></tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (state.tab === 'drivers') {
    main.innerHTML = `
      <div class="card">
        <div class="section-head"><div><div class="section-title">Q1 FY2026-27 Growth Drivers</div><div class="section-sub">MoSPI Sectoral GVA & Expenditure Components</div></div></div>
        ${DATA.gdp.drivers.map(d => `
          <div class="driver-row">
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${d.name}</span><span style="color:var(--accent)">${d.val}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%"></div></div>
            </div>
          </div>`).join('')}
      </div>
      <div class="card section-card">
        <div class="section-head"><div><div class="section-title">Official Institutional Forecasts</div><div class="section-sub">Zero media sources — official institutions only</div></div></div>
        ${DATA.gdp.forecasts.map(f => `
          <div class="feed-item">
            <div><div class="feed-title">${f.agency}</div><div class="feed-sub">${f.fy27} · ${f.fy28}</div></div>
            <a class="feed-link" href="${f.url}" target="_blank" rel="noopener">Open &nearr;</a>
          </div>`).join('')}
      </div>`;
  } else if (state.tab === 'fresh') {
    const wb = state.wbLive.gdp;
    main.innerHTML = `
      <div class="card">
        <div class="section-head"><div><div class="section-title">Official GDP & Macroeconomic Feeds</div><div class="section-sub">Indian Government (MoSPI / PIB), RBI, IMF & World Bank</div></div></div>
        ${DATA.gdp.feeds.map(f => `
          <div class="feed-item">
            <div><div class="feed-title">${f.name}</div><div class="feed-sub">${f.sub}</div></div>
            <a class="feed-link" href="${f.url}" target="_blank" rel="noopener">Open &nearr;</a>
          </div>`).join('')}
      </div>
      <div class="card section-card">
        <div class="section-head"><div><div class="section-title">World Bank Live API (India GDP)</div><div class="section-sub">Fetches Nominal, Growth, Per Capita & PPP indicators live</div></div><button class="btn-refresh" id="btnInlineFetch">Fetch Live</button></div>
        <div class="status-banner"><span>${state.wbLive.status}</span></div>
        ${wb ? `<div class="kpi-grid" style="margin-top:10px">
          <div class="card"><div class="kpi-label">WB Nominal (${wb.nom?.date || '—'})</div><div class="kpi-val green">$${wb.nom ? (wb.nom.value / 1e12).toFixed(2) + 'T' : '—'}</div></div>
          <div class="card"><div class="kpi-label">WB Growth (${wb.gr?.date || '—'})</div><div class="kpi-val">${wb.gr ? wb.gr.value.toFixed(1) + '%' : '—'}</div></div>
          <div class="card"><div class="kpi-label">WB Per Capita</div><div class="kpi-val">$${wb.pc ? Math.round(wb.pc.value).toLocaleString() : '—'}</div></div>
          <div class="card"><div class="kpi-label">WB PPP GDP</div><div class="kpi-val amber">$${wb.ppp ? (wb.ppp.value / 1e12).toFixed(2) + 'T' : '—'}</div></div>
        </div>` : ''}
      </div>`;
    document.getElementById('btnInlineFetch')?.addEventListener('click', fetchWorldBankLive);
  }

  main.querySelectorAll('.pill[data-idx]').forEach(p => p.addEventListener('click', () => {
    state.selectedIdx = Number(p.dataset.idx); render();
  }));
  attachChartClicks();
}

function renderTrade(main) {
  const tfBar = document.getElementById('timeframeBar');
  tfBar.innerHTML = ['monthly', 'quarterly', 'annual'].map(tf =>
    `<button class="seg-btn ${state.timeframe === tf ? 'active' : ''}" data-tf="${tf}">${tf.charAt(0).toUpperCase() + tf.slice(1)}</button>`
  ).join('');
  tfBar.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => {
    state.timeframe = b.dataset.tf;
    state.selectedIdx = DATA.trade[state.timeframe].length - 1;
    render();
  }));

  const scopeBar = document.getElementById('scopeBar');
  scopeBar.innerHTML = [
    { id: 'all', label: 'All (M+S)' },
    { id: 'goods', label: 'Goods' },
    { id: 'services', label: 'Services' },
    { id: 'core', label: 'Core' }
  ].map(s => `<button class="pill ${state.scope === s.id ? 'active' : ''}" data-sc="${s.id}">${s.label}</button>`).join('');
  scopeBar.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => { state.scope = p.dataset.sc; render(); }));

  if (state.tab === 'overview') {
    if (state.timeframe === 'monthly') {
      const rows = DATA.trade.monthly.map(r => {
        let exp = r.mExp + r.sExp, imp = r.mImp + r.sImp;
        if (state.scope === 'goods') { exp = r.mExp; imp = r.mImp; }
        else if (state.scope === 'services') { exp = r.sExp; imp = r.sImp; }
        else if (state.scope === 'core') { exp = r.cExp; imp = r.cImp; }
        return { ...r, exp: +exp.toFixed(2), imp: +imp.toFixed(2), bal: +(exp - imp).toFixed(2), vol: +(exp + imp).toFixed(2) };
      });
      const cur = rows[Math.min(state.selectedIdx, rows.length - 1)];
      main.innerHTML = `
        <div class="pill-row">${rows.map((r, i) => `<button class="pill dark-active ${i === state.selectedIdx ? 'active' : ''}" data-idx="${i}">${r.period}</button>`).join('')}</div>
        <div class="kpi-grid">
          <div class="card"><div class="kpi-label">Exports <span class="badge ${cur.yoy < 0 ? 'neg' : ''}">${cur.yoy > 0 ? '+' : ''}${cur.yoy}% YoY</span></div><div class="kpi-val green">$${cur.exp}B</div><div class="kpi-sub">${cur.period} · PIB ${cur.pr}</div></div>
          <div class="card"><div class="kpi-label">Imports</div><div class="kpi-val amber">$${cur.imp}B</div><div class="kpi-sub">Inward flow</div></div>
          <div class="card"><div class="kpi-label">Trade Balance</div><div class="kpi-val ${cur.bal < 0 ? 'red' : 'green'}">${cur.bal < 0 ? '-' : '+'}$${Math.abs(cur.bal)}B</div><div class="kpi-sub">${cur.bal < 0 ? 'Net Deficit' : 'Net Surplus'}</div></div>
          <div class="card"><div class="kpi-label">Total Volume</div><div class="kpi-val">$${cur.vol}B</div><div class="kpi-sub">Exports + Imports</div></div>
        </div>
        <div class="card section-card">
          <div class="section-head"><div><div class="section-title">Exports vs Imports Trend</div><div class="section-sub">US$ Billion · Tap bars for details</div></div><span class="source-tag">PIB / MoC&amp;I</span></div>
          ${buildBarChartSVG(rows, 'exp', 'imp', 'Exports ($B)', 'Imports ($B)', '#10b981', '#f59e0b', '$', 'B')}
          <div class="tooltip-box"><span><strong>${cur.period}</strong></span><span>Exp $${cur.exp}B · Imp $${cur.imp}B · Bal ${cur.bal < 0 ? '-' : '+'}$${Math.abs(cur.bal)}B</span></div>
        </div>`;
    } else {
      const rows = DATA.trade[state.timeframe].map(r => {
        const exp = r.exp ?? +(r.mExp + r.sExp).toFixed(2);
        const imp = r.imp ?? +(r.mImp + r.sImp).toFixed(2);
        return { ...r, exp, imp, bal: +(exp - imp).toFixed(2), vol: +(exp + imp).toFixed(2) };
      });
      const cur = rows[Math.min(state.selectedIdx, rows.length - 1)];
      main.innerHTML = `
        <div class="pill-row">${rows.map((r, i) => `<button class="pill dark-active ${i === state.selectedIdx ? 'active' : ''}" data-idx="${i}">${r.period}</button>`).join('')}</div>
        <div class="kpi-grid">
          <div class="card"><div class="kpi-label">Exports <span class="badge">+${cur.yoy}% YoY</span></div><div class="kpi-val green">$${cur.exp}B</div><div class="kpi-sub">${cur.pr}</div></div>
          <div class="card"><div class="kpi-label">Imports</div><div class="kpi-val amber">$${cur.imp}B</div><div class="kpi-sub">Total inward flow</div></div>
          <div class="card"><div class="kpi-label">Trade Balance</div><div class="kpi-val red">-$${Math.abs(cur.bal)}B</div><div class="kpi-sub">Net Deficit</div></div>
          <div class="card"><div class="kpi-label">Total Volume</div><div class="kpi-val">$${cur.vol}B</div><div class="kpi-sub">Exports + Imports</div></div>
        </div>
        <div class="card section-card">
          <div class="section-head"><div><div class="section-title">Exports vs Imports (${state.timeframe})</div></div><span class="source-tag">PIB / NITI</span></div>
          ${buildBarChartSVG(rows, 'exp', 'imp', 'Exports ($B)', 'Imports ($B)', '#10b981', '#f59e0b', '$', 'B')}
        </div>`;
    }
  } else if (state.tab === 'ledger') {
    main.innerHTML = `<div class="card"><div class="section-head"><div class="section-title">Monthly EXIM Ledger (US$ Bn)</div></div><table><thead><tr><th>Month</th><th class="num">Merch Exp</th><th class="num">Serv Exp</th><th class="num">Tot Exp</th><th class="num">Tot Imp</th></tr></thead><tbody>${DATA.trade.monthly.map(r => `<tr><td><strong>${r.period}</strong></td><td class="num">$${r.mExp}</td><td class="num">$${r.sExp}</td><td class="num">$${(r.mExp+r.sExp).toFixed(2)}</td><td class="num">$${(r.mImp+r.sImp).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if (state.tab === 'drivers') {
    main.innerHTML = `<div class="card"><div class="section-head"><div class="section-title">Top Export Drivers (Oct 2026)</div></div>${DATA.trade.drivers.map(d => `<div class="driver-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${d.name}</span><span style="color:var(--accent)">${d.val}</span></div><div class="bar-track"><div class="bar-fill" style="width:${d.pct}%"></div></div></div></div>`).join('')}</div>`;
  } else if (state.tab === 'fresh') {
    const wb = state.wbLive.trade;
    main.innerHTML = `<div class="card"><div class="section-head"><div class="section-title">Official Trade Feeds</div></div>${DATA.trade.feeds.map(f => `<div class="feed-item"><div><div class="feed-title">${f.name}</div><div class="feed-sub">${f.sub}</div></div><a class="feed-link" href="${f.url}" target="_blank" rel="noopener">Open &nearr;</a></div>`).join('')}</div><div class="card section-card"><div class="section-head"><div><div class="section-title">World Bank Live Annual Feed</div><div class="section-sub">NE.EXP.GNFS.CD &amp; NE.IMP.GNFS.CD (mrv=4)</div></div><button class="btn-refresh" id="btnInlineFetch">Fetch Live</button></div><div class="status-banner"><span>${state.wbLive.status}</span></div>${wb ? `<div class="kpi-grid" style="margin-top:10px"><div class="card"><div class="kpi-label">WB Exports (${wb.exp?.date || '—'})</div><div class="kpi-val green">$${wb.exp ? (wb.exp.value/1e9).toFixed(1)+'B' : '—'}</div></div><div class="card"><div class="kpi-label">WB Imports (${wb.imp?.date || '—'})</div><div class="kpi-val amber">$${wb.imp ? (wb.imp.value/1e9).toFixed(1)+'B' : '—'}</div></div></div>` : ''}</div>`;
    document.getElementById('btnInlineFetch')?.addEventListener('click', fetchWorldBankLive);
  }
  main.querySelectorAll('.pill[data-idx]').forEach(p => p.addEventListener('click', () => { state.selectedIdx = Number(p.dataset.idx); render(); }));
  attachChartClicks();
}

function renderOtherSector(main) {
  const tfBar = document.getElementById('timeframeBar');
  tfBar.innerHTML = ['monthly', 'quarterly', 'annual'].map(tf =>
    `<button class="seg-btn ${state.timeframe === tf ? 'active' : ''}" data-tf="${tf}">${tf.charAt(0).toUpperCase() + tf.slice(1)}</button>`
  ).join('');
  tfBar.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => { state.timeframe = b.dataset.tf; render(); }));
  document.getElementById('scopeBar').innerHTML = '';

  const s = state.sector;
  const rows = DATA[s][state.timeframe] || [];
  let extra = '';
  if (s === 'automobile' && DATA.automobile.companies) {
    extra = `<div class="card section-card"><div class="section-head"><div class="section-title">Company-wise Passenger Vehicle Sales (Oct 2026)</div></div>${DATA.automobile.companies.map(c => `<div class="driver-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${c.name}</span><span>${c.val}</span></div><div class="bar-track"><div class="bar-fill" style="width:${c.pct}%"></div></div></div></div>`).join('')}</div>`;
  } else if (s === 'it' && DATA.it.companies) {
    extra = `<div class="card section-card"><div class="section-head"><div class="section-title">IT Majors (Q2 FY27 Results)</div></div>${DATA.it.companies.map(c => `<div class="driver-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${c.name}</span><span>${c.val}</span></div><div class="bar-track"><div class="bar-fill" style="width:${c.pct}%"></div></div></div></div>`).join('')}</div>`;
  } else if (s === 'upi' && DATA.upi.apps) {
    extra = `<div class="card section-card"><div class="section-head"><div class="section-title">UPI App Market Share</div></div>${DATA.upi.apps.map(c => `<div class="driver-row"><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${c.name}</span><span>${c.val}</span></div><div class="bar-track"><div class="bar-fill" style="width:${c.pct}%"></div></div></div></div>`).join('')}</div>`;
  }

  main.innerHTML = `
    <div class="card">
      <div class="section-head"><div class="section-title">${SECTORS.find(x => x.id === s).label} — ${state.timeframe.toUpperCase()}</div></div>
      <table>
        <thead><tr><th>Period</th><th>Metric 1</th><th>Metric 2</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td><strong>${r.period}</strong></td><td>${r.kpi1 || r.prod || (r.gross ? (typeof r.gross === 'number' ? '₹' + r.gross.toLocaleString('en-IN') + ' Cr' : r.gross) : '') || (r.vol ? r.vol + ' Bn' : '') || r.pv}</td><td>${r.kpi2 || r.rev || (r.yoy ? '+' + r.yoy + '%' : '') || (r.val ? '₹' + r.val + 'L Cr' : '') || r.total || ''}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${extra}`;
}

function render() {
  initDrawer();
  const sec = SECTORS.find(s => s.id === state.sector);
  document.getElementById('headerTitle').textContent = `India ${sec.label} Pulse`;
  document.getElementById('headerSub').textContent = sec.sub;
  document.getElementById('bottomNav').querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));

  const main = document.getElementById('appMain');
  if (state.sector === 'gdp') renderGDP(main);
  else if (state.sector === 'trade') renderTrade(main);
  else renderOtherSector(main);
}

render();
</script>
</body>
</html>
